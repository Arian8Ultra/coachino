version: "3.9"

services:
  app:
    container_name: coachino-app
    build:
      context: .
      dockerfile: dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://coachino:coachino@coachino-postgres:5432/coachino
      NODE_ENV: production
      IMPORT: ${IMPORT:-true}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    container_name: coachino-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      SERVER_NAME: ${DOMAIN:-_}
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    command: >-
      /bin/sh -c "envsubst '$$SERVER_NAME' < /etc/nginx/conf.d/default.conf > /etc/nginx/conf.d/default.conf.rendered &&
      nginx -g 'daemon off;' -c /etc/nginx/nginx.conf"
    depends_on:
      - app

  db:
    container_name: coachino-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coachino
      POSTGRES_USER: coachino
      POSTGRES_PASSWORD: coachino
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coachino"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

volumes:
  postgres_data:
