version: "3.9"

services:
  coachino-app:
    container_name: coachino-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      IMPORT: ${IMPORT:-true}
    depends_on:
      coachino-db:
        condition: service_healthy

  coachino-db:
    container_name: coachino-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coachino
      POSTGRES_USER: coachino
      POSTGRES_PASSWORD: coachino
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coachino"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

volumes:
  postgres_data:
